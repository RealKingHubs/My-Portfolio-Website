[build]
  command   = "npm run build"
  publish   = "_site"

[[redirects]]
  # Clean URLs: /projects → /projects/index.html etc. (Netlify handles this automatically for directories)
  from   = "/pages/project.html"
  to     = "/projects/"
  status = 301

[[redirects]]
  from   = "/pages/contact.html"
  to     = "/contact/"
  status = 301

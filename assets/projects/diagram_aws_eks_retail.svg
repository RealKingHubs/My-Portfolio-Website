<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Subnet Gradients -->
    <linearGradient id="publicSubnetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Grid -->
  <g stroke="#1f2937" stroke-width="1" stroke-opacity="0.3">
    <path d="M 0,50 L 1000,50 M 0,100 L 1000,100 M 0,150 L 1000,150 M 0,200 L 1000,200 M 0,250 L 1000,250 M 0,300 L 1000,300 M 0,350 L 1000,350 M 0,400 L 1000,400 M 0,450 L 1000,450 M 0,500 L 1000,500 M 0,550 L 1000,550" />
    <path d="M 100,0 L 100,620 M 200,0 L 200,620 M 300,0 L 300,620 M 400,0 L 400,620 M 500,0 L 500,620 M 600,0 L 600,620 M 700,0 L 700,620 M 800,0 L 800,620 M 900,0 L 900,620" />
  </g>

  <!-- HEADER / TITLE -->
  <text x="30" y="35" font-family="'Manrope', sans-serif" font-size="20" font-weight="700" fill="#ffffff">InnovateMart Inc. — Project Bedrock EKS Architecture</text>
  <text x="30" y="55" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#6d7c73" letter-spacing="0.5">REGION: us-east-1 (N. Virginia)</text>

  <!-- ================= LEFT COLUMN: USERS & CONTROL ================= -->
  
  <!-- IAM USER: bedrock-dev-view -->
  <g id="developerRole">
    <rect x="25" y="90" width="180" height="120" rx="8" fill="#111827" stroke="#e0a96d" stroke-width="1.5" />
    <text x="35" y="112" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#ffffff">bedrock-dev-view</text>
    <text x="35" y="128" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" fill="#e0a96d">IAM User (Developer)</text>
    <line x1="35" y1="138" x2="190" y2="138" stroke="#374151" stroke-width="1" />
    <text x="35" y="155" font-family="'Manrope', sans-serif" font-size="9" fill="#9ca3af">- AWS Console: ReadOnly</text>
    <text x="35" y="172" font-family="'Manrope', sans-serif" font-size="9" fill="#9ca3af">- S3: PutObject (Assets)</text>
    <text x="35" y="189" font-family="'Manrope', sans-serif" font-size="9" fill="#9ca3af">- EKS: RBAC view ClusterRole</text>
  </g>

  <!-- GitHub Actions CI/CD -->
  <g id="githubActions">
    <rect x="25" y="235" width="180" height="110" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <text x="35" y="258" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#ffffff">GitHub Actions CI/CD</text>
    <text x="35" y="274" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">OIDC Authentication</text>
    <line x1="35" y1="284" x2="190" y2="284" stroke="#374151" stroke-width="1" />
    <text x="35" y="302" font-family="'Manrope', sans-serif" font-size="9" fill="#9ca3af">- PR: terraform plan</text>
    <text x="35" y="318" font-family="'Manrope', sans-serif" font-size="9" fill="#9ca3af">- Merge: terraform apply</text>
  </g>

  <!-- ================= MIDDLE AREA: VPC ================= -->
  
  <!-- project-bedrock-vpc -->
  <rect x="235" y="90" width="530" height="505" rx="12" fill="none" stroke="#2a7a56" stroke-width="2" />
  <text x="250" y="112" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#2a7a56">VPC: project-bedrock-vpc</text>

  <!-- PUBLIC SUBNETS (Multi-AZ) -->
  <rect x="255" y="130" width="150" height="445" rx="8" fill="url(#publicSubnetGrad)" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="265" y="152" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#9ca3af">Public Subnets (Multi-AZ)</text>

  <!-- Ingress / Application Load Balancer -->
  <g id="ingressALB" transform="translate(270, 240)">
    <rect x="0" y="0" width="120" height="120" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="2" filter="url(#glowBlue)" />
    <!-- Load Balancer Icon -->
    <circle cx="60" cy="45" r="14" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 60,45 L 45,45 M 60,45 L 75,35 M 60,45 L 75,55" stroke="#38bdf8" stroke-width="2" />
    <text x="15" y="85" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Application LB</text>
    <text x="12" y="100" font-family="'Manrope', sans-serif" font-size="8" fill="#38bdf8">AWS LB Controller</text>
  </g>

  <!-- PRIVATE SUBNETS (Multi-AZ) -->
  <rect x="425" y="130" width="320" height="445" rx="8" fill="url(#publicSubnetGrad)" stroke="#1f6345" stroke-width="1.5" />
  <text x="435" y="152" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#6c9f84">Private Subnets (Multi-AZ)</text>

  <!-- EKS CLUSTER: project-bedrock-cluster -->
  <g id="eksCluster">
    <rect x="440" y="170" width="290" height="230" rx="8" fill="#111827" stroke="#a855f7" stroke-width="2" filter="url(#glowPurple)" />
    <text x="455" y="192" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#ffffff">EKS: project-bedrock-cluster</text>
    <text x="455" y="206" font-family="'Manrope', sans-serif" font-size="9" fill="#a855f7">Namespace: retail-app (Kubernetes v1.34+)</text>

    <!-- UI Pod -->
    <rect x="455" y="225" width="115" height="45" rx="4" fill="#1f2937" stroke="#a855f7" stroke-width="1" />
    <circle cx="470" cy="247" r="5" fill="#a855f7" />
    <text x="485" y="251" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#ffffff">UI Service Pod</text>

    <!-- Microservices Pods -->
    <rect x="585" y="225" width="130" height="45" rx="4" fill="#1f2937" stroke="#a855f7" stroke-width="1" />
    <circle cx="600" cy="247" r="5" fill="#a855f7" />
    <text x="612" y="251" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Microservices Pods</text>

    <!-- In-Cluster Message Brokers (RabbitMQ / Redis) -->
    <rect x="455" y="285" width="260" height="50" rx="4" fill="#1f2937" stroke="#6b7280" stroke-width="1" />
    <text x="470" y="305" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#e5e7eb">Message Brokers (RabbitMQ &amp; Redis)</text>
    <text x="470" y="322" font-family="'Manrope', sans-serif" font-size="8" fill="#9ca3af">Running in-cluster as native pods</text>

    <!-- EKS Pod Autoscaling -->
    <rect x="455" y="350" width="260" height="35" rx="4" fill="#111827" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2" />
    <text x="470" y="371" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#a855f7">Horizontal Pod Autoscaler (HPA)</text>
  </g>

  <!-- RDS Managed Databases (MySQL & PostgreSQL) -->
  <g id="rdsDataLayer" transform="translate(440, 420)">
    <rect x="0" y="0" width="290" height="135" rx="8" fill="#111827" stroke="#53a97c" stroke-width="2" filter="url(#glowGreen)" />
    <text x="15" y="22" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Managed AWS RDS instances (Private)</text>
    <text x="15" y="36" font-family="'Manrope', sans-serif" font-size="9" fill="#53a97c">Protected via Security Groups (EKS Pod CIDR access only)</text>
    
    <!-- RDS MySQL -->
    <rect x="15" y="55" width="120" height="60" rx="4" fill="#1f2937" stroke="#53a97c" stroke-width="1" />
    <text x="25" y="78" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#ffffff">RDS MySQL</text>
    <text x="25" y="95" font-family="'Manrope', sans-serif" font-size="8" fill="#9ca3af">Retail Core Db</text>

    <!-- RDS PostgreSQL -->
    <rect x="150" y="55" width="120" height="60" rx="4" fill="#1f2937" stroke="#53a97c" stroke-width="1" />
    <text x="160" y="78" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#ffffff">RDS PostgreSQL</text>
    <text x="160" y="95" font-family="'Manrope', sans-serif" font-size="8" fill="#9ca3af">Order/User Db</text>
  </g>

  <!-- ================= RIGHT COLUMN: REGION LEVEL SERVICES ================= -->

  <!-- AWS DynamoDB (Cart Storage) -->
  <g id="dynamodb">
    <rect x="790" y="170" width="185" height="85" rx="8" fill="#111827" stroke="#53a97c" stroke-width="1.5" />
    <text x="802" y="195" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Amazon DynamoDB</text>
    <text x="802" y="215" font-family="'Manrope', sans-serif" font-size="10" fill="#53a97c">Cart Service Storage</text>
    <text x="802" y="235" font-family="'Manrope', sans-serif" font-size="8" fill="#9ca3af">Managed NoSQL Engine</text>
  </g>

  <!-- Serverless S3 -> Lambda Asset Processing -->
  <g id="serverlessImageProcessing">
    <rect x="790" y="275" width="185" height="175" rx="8" fill="#111827" stroke="#e0a96d" stroke-width="1.5" />
    <text x="802" y="298" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Serverless Processor</text>
    
    <!-- S3 Bucket -->
    <rect x="802" y="315" width="160" height="50" rx="4" fill="#1f2937" stroke="#e0a96d" stroke-width="1" />
    <text x="812" y="333" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#ffffff">bedrock-assets-*</text>
    <text x="812" y="348" font-family="'Manrope', sans-serif" font-size="8" fill="#e0a96d">Private S3 Bucket</text>
    
    <!-- S3 Trigger arrow -->
    <path d="M 882,365 L 882,385" fill="none" stroke="#e0a96d" stroke-width="1.5" />
    <polygon points="882,385 879,379 885,379" fill="#e0a96d" />
    <text x="888" y="378" font-family="'Manrope', sans-serif" font-size="8" fill="#e0a96d">Upload Event</text>

    <!-- Lambda Function -->
    <rect x="802" y="390" width="160" height="50" rx="4" fill="#1f2937" stroke="#e0a96d" stroke-width="1" />
    <text x="812" y="410" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#ffffff">bedrock-asset-processor</text>
    <text x="812" y="425" font-family="'Manrope', sans-serif" font-size="8" fill="#e0a96d">AWS Lambda Function</text>
  </g>

  <!-- Observability - Amazon CloudWatch -->
  <g id="cloudwatchLogs">
    <rect x="790" y="470" width="185" height="85" rx="8" fill="#111827" stroke="#e0a96d" stroke-width="1.5" />
    <text x="802" y="495" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Amazon CloudWatch</text>
    <text x="802" y="515" font-family="'Manrope', sans-serif" font-size="9" fill="#b7c5bc">Centralized Logs Store</text>
    <text x="802" y="533" font-family="'Manrope', sans-serif" font-size="8" fill="#e0a96d">Cluster, Pods, &amp; Lambda</text>
  </g>

  <!-- ================= PATH CONNECTIONS ================= -->

  <!-- GitOps deploying VPC & EKS & RDS -->
  <path d="M 205,290 L 235,290" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />
  <polygon points="235,290 227,285 227,295" fill="#38bdf8" />
  <text x="180" y="280" font-family="'Manrope', sans-serif" font-size="8" fill="#38bdf8">Terraform IaC</text>

  <!-- Developer Access console & Kubectl -->
  <!-- Kubectl -> EKS -->
  <path d="M 115,90 L 115,75 L 480,75 L 480,170" fill="none" stroke="#e0a96d" stroke-width="1.5" />
  <polygon points="480,170 476,162 484,162" fill="#e0a96d" />
  <text x="310" y="70" font-family="'Manrope', sans-serif" font-size="9" fill="#e0a96d">Kubectl Read-only (RBAC mapped)</text>

  <!-- Public user -> ALB Ingress -->
  <path d="M 230,300 L 270,300" fill="none" stroke="#a855f7" stroke-width="3" />
  <polygon points="270,300 262,295 262,305" fill="#a855f7" />
  <text x="215" y="318" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#a855f7">UI Access</text>

  <!-- ALB Ingress -> UI Pod (Inside Cluster) -->
  <path d="M 390,300 L 455,250" fill="none" stroke="#a855f7" stroke-width="2.5" />
  <polygon points="455,250 446,250 451,257" fill="#a855f7" />
  <text x="395" y="280" font-family="'Manrope', sans-serif" font-size="8" fill="#a855f7">Ingress Routing</text>

  <!-- Microservices -> RDS MySQL & Postgres -->
  <path d="M 585,380 L 585,420" fill="none" stroke="#53a97c" stroke-width="2" />
  <polygon points="585,420 581,412 589,412" fill="#53a97c" />

  <!-- Microservices -> DynamoDB -->
  <path d="M 715,247 L 790,247" fill="none" stroke="#53a97c" stroke-width="2" />
  <polygon points="790,247 782,243 782,251" fill="#53a97c" />

  <!-- Logging shipping: EKS -> CloudWatch -->
  <path d="M 730,350 L 760,350 L 760,510 L 790,510" fill="none" stroke="#e0a96d" stroke-width="1.5" stroke-dasharray="4,2" />
  <polygon points="790,510 782,506 782,514" fill="#e0a96d" />

  <!-- Lambda -> CloudWatch Logs -->
  <path d="M 882,440 L 882,470" fill="none" stroke="#e0a96d" stroke-width="1.5" stroke-dasharray="4,2" />
  <polygon points="882,470 879,464 885,464" fill="#e0a96d" />

  <!-- Legend -->
  <g transform="translate(30, 565)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2" />
    <text x="40" y="14" font-family="'Manrope', sans-serif" font-size="10" fill="#9ca3af">IaC Deployment (Terraform)</text>
    
    <line x1="220" y1="10" x2="250" y2="10" stroke="#a855f7" stroke-width="2.5" />
    <text x="260" y="14" font-family="'Manrope', sans-serif" font-size="10" fill="#9ca3af">Ingress Web Traffic</text>

    <line x1="440" y1="10" x2="470" y2="10" stroke="#53a97c" stroke-width="2" />
    <text x="480" y="14" font-family="'Manrope', sans-serif" font-size="10" fill="#9ca3af">Data Layer Access</text>

    <line x1="630" y1="10" x2="660" y2="10" stroke="#e0a96d" stroke-width="1.5" stroke-dasharray="3,1" />
    <text x="670" y="14" font-family="'Manrope', sans-serif" font-size="10" fill="#9ca3af">Logs &amp; Control Access</text>
  </g>
</svg>
